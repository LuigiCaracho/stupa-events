# STUPA Events: OIDC provider, application and role groups for LOCAL development against Luis'
# own Authentik (auth.luismeyer.eu). Not the production provider at sso.reutlingen.university
# (PLAN 5.6); its redirect is https://events.reutlingen.university/api/auth/callback.
#
# Drop this file into ~/.nixos-config/modules/hosts/cloud/authentik-blueprints/ and follow
# docs/authentik/README.md (secret, env mapping, nh os switch). Nothing here is deployed by the
# repo. Removing a blueprint does not delete its objects.
#
# The backend reads roles from the `groups` claim. Group names follow events-<org>-<role> and
# events-editor (M1-KONTRAKT 5). The groups are defined inline so the policybindings below can
# resolve them in the same apply pass. Membership is managed by hand or in users.yaml.
#
# Scopes: openid email profile offline_access + groups. offline_access gives the refresh token the
# session revalidation (SESSION_REVALIDATE_HOURS) needs; include_claims_in_id_token keeps `groups`
# in the ID token, where the backend reads it.
version: 1
metadata:
  name: stupa-events dev OIDC
entries:
  - model: authentik_core.group
    id: events-editor-group
    identifiers:
      name: events-editor
    attrs: {}
  - model: authentik_core.group
    id: events-fsi-organizer-group
    identifiers:
      name: events-fsi-organizer
    attrs: {}
  - model: authentik_core.group
    id: events-fsi-submitter-group
    identifiers:
      name: events-fsi-submitter
    attrs: {}
  - model: authentik_core.group
    id: events-makers-organizer-group
    identifiers:
      name: events-makers-organizer
    attrs: {}
  - model: authentik_providers_oauth2.scopemapping
    id: stupa-events-scope-groups
    identifiers:
      name: stupa-events groups
    attrs:
      scope_name: groups
      expression: |
        return {"groups": [group.name for group in request.user.ak_groups.all()]}
  - model: authentik_providers_oauth2.oauth2provider
    id: stupa-events-provider
    identifiers:
      name: stupa-events
    attrs:
      client_type: confidential
      client_id: stupa-events
      client_secret: !Env AUTHENTIK_STUPA_EVENTS_CLIENT_SECRET
      grant_types:
        - authorization_code
        - refresh_token
      include_claims_in_id_token: true
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:8081/api/auth/callback
        - matching_mode: strict
          url: http://localhost:4200/api/auth/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
        - !KeyOf stupa-events-scope-groups
  - model: authentik_core.application
    id: stupa-events-app
    identifiers:
      slug: stupa-events
    attrs:
      name: STUPA Events (Entwicklung)
      provider: !KeyOf stupa-events-provider
      meta_launch_url: http://localhost:8081/
      meta_description: Lokale Entwicklungsinstanz von STUPA Events
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf stupa-events-app
      group: !KeyOf events-editor-group
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf stupa-events-app
      group: !KeyOf events-fsi-organizer-group
    attrs:
      order: 10
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf stupa-events-app
      group: !KeyOf events-fsi-submitter-group
    attrs:
      order: 20
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf stupa-events-app
      group: !KeyOf events-makers-organizer-group
    attrs:
      order: 30
