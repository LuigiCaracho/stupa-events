# Copied from STUPA-Workflow@93c33d6 backend/alembic.ini (comment trimmed)
# Alembic configuration (T-06). `migrations/env.py` reads the asyncpg database URL from
# the app settings. `sqlalchemy.url` stays empty here. A test or CI run can override it
# with `-x` or `set_main_option`.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
# Migration file names: <rev>_<slug>.
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
