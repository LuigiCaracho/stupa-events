# Copied from STUPA-Workflow@93c33d6 backend/pyproject.toml (trimmed to the M1 dependencies)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stupa-events-backend"
version = "0.0.1"
description = "STUPA Events backend (FastAPI + arq)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "arq>=0.26",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.1",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "aiosmtplib>=3.0",
    "python-magic>=0.4",
    "minio>=7.2",
    "clamd>=1.0.2",
    "python-multipart>=0.0.18",
    "redis>=5.0",
    "pillow>=11.0",
    "pyyaml>=6.0",
    "markdown-it-py>=3.0",
    "nh3>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "coverage[toml]>=7.6",
    "testcontainers[postgres,redis]>=4.9",
    "respx>=0.22",
    "freezegun>=1.5",
    "polyfactory>=2.18",
    "schemathesis==4.30.1",
    "hypothesis==6.168.5",
    "ruff>=0.9",
    "basedpyright>=1.28",
    "psycopg[binary]>=3.2",
    "icalendar>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
exclude = ["migrations/versions", ".venv"]

# Test doubles stand in for AsyncSession and Request, so argument types are not checked there.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportArgumentType = false
reportAttributeAccessIssue = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration and not e2e and not live and not perf'"
markers = [
    "integration: needs testcontainers (Postgres/Redis), Docker required",
    "e2e: end-to-end against an ephemeral compose stack",
    "live: talks to a real external system, never part of CI",
    "perf: 5000-event latency check against a throwaway Postgres, run on demand (-m perf)",
]

[tool.coverage.run]
branch = true
concurrency = ["greenlet", "thread"]
source = ["app", "worker"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 97
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
