<section class="gl" [attr.aria-labelledby]="headingId()">
  <h2 class="sec" [id]="headingId()">{{ heading() | t }}</h2>
  @if (sorted().length === 0) {
    <p class="gl__ready" role="status">{{ 'guards.ready' | t }}</p>
  } @else {
    <ul class="gl__list rowgroup">
      @for (reason of sorted(); track $index) {
        <li class="gl__row" [attr.data-code]="reason.code">
          <app-status-text
            class="gl__sev"
            [kind]="reason.severity === 'blocker' ? 'error' : 'warn'"
          >
            {{ (reason.severity === 'blocker' ? 'guards.blocker' : 'guards.warning') | t }}
          </app-status-text>
          <span class="gl__text">{{ text(reason) }}</span>
          @if (fixKey(reason); as key) {
            <app-button variant="tonal" size="sm" (click)="fix.emit(reason)">{{
              key | t
            }}</app-button>
          }
        </li>
      }
    </ul>
  }
</section>
