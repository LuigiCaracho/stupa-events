<div class="sp">
  @if (mode() === 'button') {
    <button
      type="button"
      class="sp__field sp__button"
      [attr.aria-label]="name()"
      (click)="activate.emit()"
    >
      <app-icon class="sp__icon" name="search" [size]="20" />
      <span class="sp__ph">{{ placeholder() }}</span>
    </button>
  } @else {
    <label class="sp__field">
      @if (busy()) {
        <span class="sp__icon sp__spinner" aria-hidden="true"></span>
      } @else {
        <app-icon class="sp__icon" name="search" [size]="20" />
      }
      <input
        #field
        class="sp__input"
        type="search"
        enterkeyhint="search"
        [attr.maxlength]="maxlength()"
        [placeholder]="placeholder()"
        [attr.aria-label]="name()"
        [attr.aria-busy]="busy() || null"
        [value]="value()"
        (input)="onInput($event)"
        (keydown)="onKey($event)"
      />
    </label>
    @if (clearable() && value() !== '') {
      <button
        type="button"
        class="sp__clear"
        [attr.aria-label]="'ui.search.clear' | t"
        [title]="'ui.search.clear' | t"
        (click)="clear(field)"
      >
        <app-icon name="x" [size]="18" />
      </button>
    }
  }
  <span class="sp__trail"><ng-content select="[trail]" /></span>
</div>
