@for (group of groups(); track group.mode) {
  <section class="co" [attr.data-mode]="group.mode">
    <h4 class="co__heading sec">{{ group.heading | t }}</h4>
    <ul class="co__list">
      @for (row of group.rows; track $index) {
        <li class="co__row">
          <span class="co__part">{{ row.part }}</span>
          @if (row.reason) {
            <span class="co__reason">{{ row.reason }}</span>
          }
        </li>
      }
    </ul>
  </section>
}
