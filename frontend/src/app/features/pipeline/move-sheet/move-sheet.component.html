<app-side-sheet
  [open]="true"
  side="bottom"
  [heading]="'board.moveTitle' | t"
  (closed)="closed.emit()"
>
  <p class="ms__card">{{ card().title }}</p>
  @if (options().length) {
    <ul class="ms__list rowgroup rowgroup--bg3">
      @for (t of options(); track t) {
        <li>
          <button type="button" class="ms__item" (click)="chosen.emit(t)">
            {{ label[t] | t }}
          </button>
        </li>
      }
    </ul>
  } @else {
    <p class="ms__empty">{{ 'board.noMoves' | t }}</p>
  }
</app-side-sheet>
