<section class="rt" aria-labelledby="fu-retro-heading">
  <h2 class="sec" id="fu-retro-heading" tabindex="-1">{{ 'retro.title' | t }}</h2>
  <p class="rt__hint">{{ 'retro.hint' | t }}</p>
  @if (!list.hasValue()) {
    @if (list.error()) {
      <app-note kind="error" role="alert">{{ 'retro.loadFailed' | t }}</app-note>
    } @else {
      <app-skeleton variant="panel" />
    }
  } @else if (doc(); as d) {
    <app-document-editor
      [documentId]="d.id"
      [canEdit]="canEdit()"
      keyPrefix="retro"
      [label]="'retro.title' | t"
      (saved)="changed.emit()"
    />
  } @else {
    <app-dossier-markdown-editor
      [label]="'retro.title' | t"
      [docKey]="'retro-new:' + event().id"
      [disabled]="!canEdit()"
      [value]="text()"
      (valueChange)="text.set($event)"
    />
    @if (canEdit()) {
      <div class="rt__actions">
        <app-button variant="fill" [loading]="saving()" (click)="create()">{{
          'retro.save' | t
        }}</app-button>
      </div>
    } @else {
      <p class="rt__hint">{{ 'retro.none' | t }}</p>
    }
  }
</section>
