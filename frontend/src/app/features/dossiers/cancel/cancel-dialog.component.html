<app-dialog
  [open]="true"
  [title]="TITLE[mode()] | t"
  [subtitle]="event().title"
  [closeLabel]="'action.close' | t"
  (closed)="closed.emit()"
>
  <div class="cd">
    <app-input
      [label]="'cancel.reason' | t"
      [hint]="'cancel.reasonHint' | t"
      [error]="error() === 'reasonLong' ? ('cancel.errReasonLong' | t) : ''"
      [ngModel]="reason()"
      (ngModelChange)="reason.set($event)"
    />
    @if (mode() !== 'reinstate') {
      <app-select
        [label]="'cancel.publicReason' | t"
        [clearable]="false"
        [options]="codeOptions()"
        [value]="code()"
        (valueChange)="code.set($any($event))"
      />
      <app-input
        [label]="'cancel.publicText' | t"
        [hint]="'cancel.publicTextHint' | t: { max: textMax }"
        [error]="error() === 'publicText' ? ('cancel.errPublicText' | t: { max: textMax }) : ''"
        [ngModel]="publicText()"
        (ngModelChange)="publicText.set($event)"
      />
      @if (mode() === 'postpone') {
        <app-datetime-field
          [dateLabel]="'cancel.newDate' | t"
          [timeLabel]="'cancel.newTime' | t"
          [hint]="'cancel.newDateHint' | t"
          [error]="error() === 'newDate' ? ('cancel.errNewDate' | t) : ''"
          [(date)]="newDate"
          [(time)]="newTime"
        />
      }
      <app-note>{{ 'cancel.preview' | t: { status: preview() } }}</app-note>
      <p class="cd__muted">{{ 'cancel.subscribers' | t }}</p>
    } @else {
      <p class="cd__muted">{{ 'cancel.reinstateBody' | t }}</p>
    }
  </div>
  <div dialog-footer class="cd__footer">
    <app-button variant="text" (click)="closed.emit()">{{ 'action.cancel' | t }}</app-button>
    <app-button [variant]="mode() === 'reinstate' ? 'fill' : 'danger'" [loading]="busy()" (click)="submit()">
      {{ SUBMIT[mode()] | t }}
    </app-button>
  </div>
</app-dialog>
