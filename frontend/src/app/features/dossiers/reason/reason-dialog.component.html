<app-dialog
  [open]="true"
  [title]="heading() | t"
  [subtitle]="subtitle()"
  [closeLabel]="'action.close' | t"
  (closed)="closed.emit()"
>
  <div class="rd">
    <app-input
      [label]="label() | t"
      [hint]="'transition.noteHint' | t"
      [required]="required()"
      [error]="attempted() && invalid() ? ('transition.errReason' | t) : ''"
      [ngModel]="text()"
      (ngModelChange)="text.set($event)"
    />
  </div>
  <div dialog-footer class="rd__footer">
    <app-button variant="text" (click)="closed.emit()">{{ 'action.cancel' | t }}</app-button>
    <app-button variant="fill" [loading]="busy()" (click)="submit()">{{
      confirm() | t
    }}</app-button>
  </div>
</app-dialog>
