<!-- Copied from STUPA-Workflow@93c33d6 frontend/src/app/layout/bottom-bar/bottom-bar.component.html -->
<nav class="bb" [attr.aria-label]="'nav.main' | t">
  @for (item of barItems(); track item.key) {
    <a
      class="bb__item"
      [routerLink]="item.path"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
    >
      <span class="bb__ind"><app-icon [name]="item.icon" [size]="22" /></span>
      <span class="bb__label">{{ item.labelKey | t }}</span>
    </a>
  }
  @if (moreItems().length > 0) {
    <button
      type="button"
      class="bb__item"
      [class.is-active]="moreActive()"
      aria-haspopup="dialog"
      (click)="moreOpen.set(true)"
    >
      <span class="bb__ind"><app-icon name="menu" [size]="22" /></span>
      <span class="bb__label">{{ 'nav.more' | t }}</span>
    </button>
  }
  @if (store.signedIn()) {
    <button
      type="button"
      class="bb__item"
      [attr.aria-label]="bellLabel()"
      (click)="store.openInbox()"
    >
      <span class="bb__ind">
        <app-icon name="bell" [size]="22" />
        @if (store.count() > 0) {
          <span class="bb__badge" aria-hidden="true">{{ store.badge() }}</span>
        }
      </span>
      <span class="bb__label">{{ 'bell.label' | t }}</span>
    </button>
  }
</nav>

<app-side-sheet side="bottom" [open]="moreOpen()" [heading]="'nav.more' | t" (closed)="moreOpen.set(false)">
  <ul class="bb__more">
    @for (item of moreItems(); track item.key) {
      <li>
        <a
          class="bb__moreLink"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
          (click)="moreOpen.set(false)"
        >
          <app-icon [name]="item.icon" [size]="22" />
          <span>{{ item.labelKey | t }}</span>
        </a>
      </li>
    }
  </ul>
</app-side-sheet>
