# Security headers (PLAN 11.2, E37). nginx replaces inherited add_header sets inside a location,
# so server{} and EVERY location{} include this file. $ev_referrer_policy comes from nginx.conf.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Referrer-Policy $ev_referrer_policy always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Cache-Control $ev_cache_control always;
