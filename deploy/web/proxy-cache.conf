# Short proxy cache for the public GETs (B1 contract 5.1, PLAN 11.7): one copy per URL for 60 s, one
# upstream request per key at a time, stale copy on upstream errors. No cookie goes up and none comes
# back, so a cached page can never carry somebody's session. Included next to api-proxy.conf.
proxy_cache ev_pub;
proxy_cache_valid 200 60s;
proxy_cache_lock on;
proxy_cache_use_stale error timeout updating;
proxy_cache_key "$host$uri$is_args$args";
proxy_set_header Cookie "";
proxy_ignore_headers Set-Cookie;
add_header X-Cache-Status $upstream_cache_status always;
