# web/nginx.conf: plain HTTP, no TLS; the external Caddy terminates TLS and sets HSTS.
# Copied from STUPA-Workflow@93c33d6 deploy/web/nginx.conf (adapted). Routes /api, /ics, /e/, /k/, /suche,
# /sitemap.xml and /robots.txt to the API, the rest is the SPA. Security headers come from
# snippets/security-headers.conf, included in server{} and in every location{}.

map $uri $ev_cache_control {
    default                "no-cache";
    ~^/(?:api|e|ics|k)/    "";
    /suche                 "";
    /sitemap.xml           "";
    /robots.txt            "";
    ~*\.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|webp|avif|gif|ico)$  "public, max-age=31536000, immutable";
    /ngsw-worker.js        "no-cache";
    /safety-worker.js      "no-cache";
    /worker-basic.min.js   "no-cache";
    /ngsw.json             "no-cache";
}

map $uri $ev_referrer_policy {
    default            "strict-origin-when-cross-origin";
    ~^/ics/            "no-referrer";
}

log_format ev_noquery '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
log_format ev_ics_redacted '$remote_addr [$time_local] "$request_method /ics/p/..." $status $body_bytes_sent';

limit_req_zone $binary_remote_addr zone=ev_public:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ev_page:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=ev_conn:10m;

server_tokens off;

server {
    listen 80;
    server_name _;

    # Exact IP of the direct upstream (Caddy), never RFC1918 ranges: every sibling container
    # could spoof X-Forwarded-For otherwise. 192.0.2.1 (TEST-NET-1) is a no-op placeholder;
    # replace it in production (the file is bind-mounted, no rebuild needed).
    set_real_ip_from 192.0.2.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Poster upload (images, 11 MiB incl. multipart overhead). Regex wins over the /api/ prefix.
    location ~ ^/api/events/[^/]+/poster/?$ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 11m;
        proxy_read_timeout 120s;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Document upload (from M4, 26 MiB).
    location ~ ^/api/events/[^/]+/attachments/?$ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 26m;
        proxy_read_timeout 120s;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Public API: tight body cap, per-IP limits, access log without query.
    location /api/public/ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 16k;
        limit_req zone=ev_public burst=20 nodelay;
        limit_conn ev_conn 20;
        access_log /var/log/nginx/access.log ev_noquery;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1m;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Personal ICS token path: never in the access log.
    location ~ ^/ics/p/ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1k;
        limit_req zone=ev_page burst=10 nodelay;
        access_log /var/log/nginx/access.log ev_ics_redacted;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location /ics/ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1k;
        limit_req zone=ev_page burst=10 nodelay;
        limit_conn ev_conn 20;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Server-rendered event pages (OpenGraph for link previews), not the SPA shell.
    location /e/ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1k;
        limit_req zone=ev_page burst=10 nodelay;
        limit_conn ev_conn 20;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location /k/ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1k;
        limit_req zone=ev_page burst=10 nodelay;
        limit_conn ev_conn 20;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location = /suche {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1k;
        limit_req zone=ev_page burst=10 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1k;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1k;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Dynamic PWA manifest; must NOT be in an ngsw asset group (as in the Workflow tool).
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        rewrite ^ /api/manifest.webmanifest break;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # SPA fallback.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
