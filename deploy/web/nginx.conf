# web/nginx.conf: plain HTTP, no TLS; the external Caddy terminates TLS and sets HSTS.
# Copied from STUPA-Workflow@93c33d6 deploy/web/nginx.conf (adapted). Routes /api, /ics, /, /e/, /k/, /suche,
# /kalender, /rueckblick, /sitemap.xml and /robots.txt to the API, the rest is the SPA. Security headers come
# from snippets/security-headers.conf, included in server{} and in every location{}. Public GETs are cached
# for 5 s (snippets/proxy-cache.conf, never with a cookie; the Redis tier and the browser carry the 60 s); the access log has no query string anywhere
# except the redacted /ics/p/ line.

map $uri $ev_cache_control {
    default                "no-cache";
    ~^/(?:abo|bestaetigen)/  "no-store";
    ~^/(?:api|e|ics|k)/    "";
    /                      "";
    /suche                 "";
    /kalender              "";
    /rueckblick            "";
    /sitemap.xml           "";
    /robots.txt            "";
    ~*\.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|webp|avif|gif|ico)$  "public, max-age=31536000, immutable";
    /ngsw-worker.js        "no-cache";
    /safety-worker.js      "no-cache";
    /worker-basic.min.js   "no-cache";
    /ngsw.json             "no-cache";
}

# Shell pages ignore the query string, so one copy per path; only the JSON API and the ICS feeds vary by query.
map $uri $ev_cache_key {
    default                "$uri";
    ~^/(?:api/public|ics)/ "$uri$is_args$args";
}

map $uri $ev_referrer_policy {
    default            "strict-origin-when-cross-origin";
    ~^/(?:ics|abo|bestaetigen)/  "no-referrer";
}

# First path segment of a page whose URL carries a secret (calendar token, manage link, confirm link).
map $uri $ev_token_prefix {
    ~^/(?<segment>abo|bestaetigen)(?:/|$)  $segment;
    default                          "-";
}

log_format ev_noquery '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
log_format ev_token_redacted '$remote_addr [$time_local] "$request_method /$ev_token_prefix/..." $status $body_bytes_sent';
log_format ev_ics_redacted '$remote_addr [$time_local] "$request_method /ics/p/..." $status $body_bytes_sent';

proxy_cache_path /var/cache/nginx/ev levels=1:2 keys_zone=ev_pub:5m max_size=64m inactive=10m use_temp_path=off;

limit_req_zone $binary_remote_addr zone=ev_public:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ev_page:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=ev_conn:10m;
# 429 is what the SPA explains ("Zu viele Anfragen"). Rejections log at info, below the image's
# notice level: the error line carries the full request line with the query, and no search text
# belongs in a log. The access log still counts each rejection, without the query.
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level info;
limit_conn_log_level info;

server_tokens off;

server {
    listen 80;
    server_name _;

    # set_real_ip_from comes from conf.d/real-ip.conf (rendered from templates/real-ip.conf.template with
    # TRUSTED_PROXY_IP): the exact IP of the direct upstream (Caddy), never RFC1918 ranges, or every
    # sibling container could spoof X-Forwarded-For. compose-lint refuses the 192.0.2.1 no-op outside dev.
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log ev_noquery;

    gzip on;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types application/json text/calendar application/xml text/plain;  # text/html is always compressed

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Poster upload (images, 11 MiB incl. multipart overhead). Regex wins over the /api/ prefix.
    location ~ ^/api/events/[^/]+/poster/?$ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 11m;
        proxy_read_timeout 120s;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Document upload (from M4, 26 MiB).
    location ~ ^/api/events/[^/]+/attachments/?$ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 26m;
        proxy_read_timeout 120s;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Replacement upload of an attachment (26 MiB).
    location ~ ^/api/attachments/[^/]+/replace/?$ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 26m;
        proxy_read_timeout 120s;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Markdown image upload (10 MiB image plus multipart overhead).
    location = /api/media/images {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 11m;
        proxy_read_timeout 120s;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Poster derivatives: immutable, the browser caches them for a year, so nginx does not.
    location /api/public/media/ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 16k;
        limit_req zone=ev_public burst=20 nodelay;
        limit_conn ev_conn 20;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Subscriptions and ALTCHA: never cached (a GET carries a token header, a challenge must be fresh),
    # tight body cap, 5 r/s per IP. The Get started questions stay under /api/public/ and are cached.
    location ^~ /api/public/subscriptions {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 4k;
        limit_req zone=ev_page burst=10 nodelay;
        limit_conn ev_conn 20;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location ^~ /api/public/altcha/ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1k;
        limit_req zone=ev_page burst=10 nodelay;
        limit_conn ev_conn 20;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Public API: tight body cap, per-IP limits, 5 s proxy cache.
    location /api/public/ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 16k;
        limit_req zone=ev_public burst=20 nodelay;
        limit_conn ev_conn 20;
        include /etc/nginx/snippets/proxy-cache.conf;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1m;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Personal ICS token path: never in the access log.
    location ~ ^/ics/p/ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1k;
        limit_req zone=ev_page burst=10 nodelay;
        access_log /var/log/nginx/access.log ev_ics_redacted;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Category and all-events calendars: public, no query in the access log (A08).
    location /ics/ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1k;
        limit_req zone=ev_page burst=10 nodelay;
        limit_conn ev_conn 20;
        include /etc/nginx/snippets/proxy-cache.conf;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Server-rendered event pages (OpenGraph for link previews), not the SPA shell.
    location /e/ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1k;
        limit_req zone=ev_page burst=10 nodelay;
        limit_conn ev_conn 20;
        include /etc/nginx/snippets/proxy-cache.conf;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location /k/ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1k;
        limit_req zone=ev_page burst=10 nodelay;
        limit_conn ev_conn 20;
        include /etc/nginx/snippets/proxy-cache.conf;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Manage and confirm pages: the SPA shell only, token paths are redacted in the log, never cached.
    # The bare /abo and /bestaetigen answer a reload after the SPA dropped the token from the URL.
    # alias keeps $uri, so the header maps still see the real path.
    location ~ ^/(?:abo|bestaetigen)(?:/[^/]+)?$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-store" always;
        client_max_body_size 1k;
        limit_req zone=ev_page burst=10 nodelay;
        access_log /var/log/nginx/access.log ev_token_redacted;
        default_type text/html;
        alias /usr/share/nginx/html/index.html;
    }

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1k;
        limit_req zone=ev_page burst=10 nodelay;
        include /etc/nginx/snippets/proxy-cache.conf;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location = /suche {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1k;
        limit_req zone=ev_page burst=10 nodelay;
        include /etc/nginx/snippets/proxy-cache.conf;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location = /kalender {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1k;
        limit_req zone=ev_page burst=10 nodelay;
        include /etc/nginx/snippets/proxy-cache.conf;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location = /rueckblick {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1k;
        limit_req zone=ev_page burst=10 nodelay;
        include /etc/nginx/snippets/proxy-cache.conf;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location = /start {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1k;
        limit_req zone=ev_page burst=10 nodelay;
        include /etc/nginx/snippets/proxy-cache.conf;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location = /abos {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1k;
        limit_req zone=ev_page burst=10 nodelay;
        include /etc/nginx/snippets/proxy-cache.conf;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1k;
        include /etc/nginx/snippets/proxy-cache.conf;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1k;
        include /etc/nginx/snippets/proxy-cache.conf;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Dynamic PWA manifest; must NOT be in an ngsw asset group (as in the Workflow tool).
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        rewrite ^ /api/manifest.webmanifest break;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # SPA fallback.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
