# STUPA Events compose stack: one VM, plain HTTP inside, behind the external Caddy (TLS edge).
# Copied from STUPA-Workflow@93c33d6 deploy/docker-compose.yml (adapted). Separate stack: own
# project name, volumes, ports (web 8081) and subnet, so it lives beside the
# Workflow stack (`antragsplattform`, 8080/5433). Only `web` publishes a host
# port, on loopback; admin access to Postgres goes through `docker compose exec`. Env: copy .env.example to .env (prod) or .env.dev.example to .env.dev.

name: stupa-events

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

x-backend: &backend
  build:
    context: ..
    dockerfile: backend/Dockerfile
  env_file:
    - path: ${ENV_FILE:-.env}
      required: true
  <<: [*restart, *logging]

services:
  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    <<: [*restart, *logging]
    mem_limit: 64m
    cpus: 0.5
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - ./web/api-proxy.conf:/etc/nginx/snippets/api-proxy.conf:ro
      - ./web/proxy-cache.conf:/etc/nginx/snippets/proxy-cache.conf:ro
    networks:
      internal:
        ipv4_address: 172.29.10.10
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  api:
    <<: *backend
    mem_limit: 512m
    cpus: 1.0
    environment:
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.29.10.10}
    volumes:
      - ./secrets:/secrets:ro,z
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *backend
    command: ["arq", "worker.main.WorkerSettings"]
    mem_limit: 768m
    cpus: 1.0
    volumes:
      - ./secrets:/secrets:ro,z
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_started
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "arq --check worker.main.WorkerSettings || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    <<: [*restart, *logging]
    mem_limit: 768m
    cpus: 1.0
    command: ["postgres", "-c", "shared_buffers=192MB", "-c", "max_connections=40"]
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      EVENTS_APP_PASSWORD: ${EVENTS_APP_PASSWORD:?set EVENTS_APP_PASSWORD}
      EVENTS_MIGRATOR_PASSWORD: ${EVENTS_MIGRATOR_PASSWORD:?set EVENTS_MIGRATOR_PASSWORD}
      EVENTS_PUBLIC_PASSWORD: ${EVENTS_PUBLIC_PASSWORD:?set EVENTS_PUBLIC_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ./db/roles.sql:/db/roles.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d events"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    <<: [*restart, *logging]
    mem_limit: 320m
    cpus: 0.5
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    pull_policy: missing
    <<: [*restart, *logging]
    mem_limit: 384m
    cpus: 0.5
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  clamav:
    image: clamav/clamav:1.4.3
    pull_policy: missing
    <<: [*restart, *logging]
    mem_limit: 3g
    cpus: 2.0
    environment:
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 300s

volumes:
  pg_data:
  minio_data:
  redis_data:
  clamav_data:

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.10.0/24
